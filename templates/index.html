<!DOCTYPE html>
<html lang="fr">
{% include "head.html" %}
<body>
  <header class="topbar">
    <h1 class="brand">📺 MamieTV</h1>
    <div class="topbar-right">
      <span class="clock" id="clock"></span>
      <button id="refresh" class="refresh" type="button" title="Actualiser" aria-label="Actualiser">↻</button>
    </div>
  </header>

  <main>
    <p class="subtitle" id="subtitle"></p>
    <div id="status" class="status" role="status">Chargement du programme…</div>
    <div id="channels" class="channels" aria-live="polite"></div>
  </main>

  {% include "footer.html" %}

  <script>window.MAMIETV_DATA = "data/epg.json?v={{ data_hash }}";</script>
  <script defer src="js/app.js?v={{ js_hash }}"></script>
</body>
</html>
