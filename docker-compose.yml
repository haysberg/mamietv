services:
  mamietv:
    image: ghcr.io/haysberg/mamietv:latest
    container_name: "mamietv"
    restart: unless-stopped
    init: true
    ports:
      - "8000:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
