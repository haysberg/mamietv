version: '3'

tasks:
  default:
    desc: Generate the static site into dist/
    cmds:
      - uv run python build.py

  build:
    desc: Generate the static site into dist/
    cmds:
      - uv run python build.py

  preview:
    desc: Serve the generated dist/ locally on http://localhost:8000
    cmds:
      - python3 -m http.server -d dist 8000

  icons:
    desc: Regenerate the PWA/favicon icons (Pillow, dev only)
    cmds:
      - uv run python build_tools/make_icons.py

  check:
    desc: Lint and run the test suite
    cmds:
      - uv run ruff check .
      - uv run pytest -q

  format:
    desc: Format the Python sources
    cmds:
      - uv run ruff format .
      - uv run ruff check --fix .
